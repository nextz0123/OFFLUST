<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OFFLUST</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#050505;--card:#0e0e0f;--card2:#161617;--line:#2a2a2d;--tx:#ece9e0;--mut:#8f8c80;--ac:#f5c400;--ac2:#ffd83a;--ok:#f5c400;--warn:#7a6a3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(ellipse 80% 40% at 50% -5%,#f5c4001c,transparent 70%),linear-gradient(180deg,#0b0b0c,#030303) fixed;color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{display:flex;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#080808ee;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--mut);padding:6px 0;border-radius:12px;transition:.2s}
nav button span{font-size:19px}
nav button.on{color:var(--ac2);background:#f5c40014}
.logo{display:none;font-weight:800;letter-spacing:.18em;font-size:18px;margin:6px 10px 24px}
.logo b{color:var(--ac2)}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:22px 16px 110px}
h1,h2,.big,.timer{font-family:Oswald,Impact,"Arial Narrow",sans-serif;text-transform:uppercase}
h1{font-size:30px;letter-spacing:.06em;margin-bottom:4px}
h2{font-size:15px;letter-spacing:.12em;color:var(--ac2);margin-bottom:10px}
.sub{color:var(--mut);margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;border-top:2px solid #5a4a00;box-shadow:0 8px 30px #000a;padding:18px;margin-bottom:14px;animation:in .45s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.grid .card{margin:0}
.big{font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1;background:linear-gradient(135deg,#fff,var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.mut{color:var(--mut);font-size:13px}
.btn{background:var(--ac);color:#0a0a0a;padding:11px 18px;border-radius:4px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;transition:.2s;display:inline-block}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn.g{background:var(--card2);border:1px solid var(--line)}
.btn.r{background:#2a1418;color:#ff8a8a}
.bar{height:8px;border-radius:9px;background:var(--card2);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px;transition:width .6s}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .t{flex:1}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;transition:.2s}
.chk.on{background:var(--ac);border-color:var(--ac);color:#0a0a0a}
.pill{display:inline-block;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card2);margin:3px 4px 3px 0;font-size:13px}
.pill.on{background:var(--ac);border-color:var(--ac);color:#0a0a0a;font-weight:600}
.quote{background:radial-gradient(circle at 50% 0%,#f5c40026,transparent 60%),#0e0e0f;border-color:#3d3300}
input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px 12px;font:inherit;margin:6px 0}
input[type=range]{padding:0;accent-color:var(--ac)}
input[type=checkbox]{width:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal div{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;background:var(--card2);font-size:13px;cursor:pointer;border:1px solid transparent}
.cal .h{background:none;aspect-ratio:auto;cursor:default;color:var(--mut);font-size:11px}
.cal .ok{background:var(--ac);color:#0a0a0a;font-weight:700}.cal .hard{background:#1a1a1c;border-color:#4d4420}.cal .td{border-color:#fff}
.med{text-align:center;padding:14px 6px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.med.off{opacity:.35;filter:grayscale(1)}.med span{font-size:30px}
.sos{position:fixed;right:16px;bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--ac);color:#0a0a0a;font-weight:800;letter-spacing:.14em;border-radius:99px;padding:14px 22px;box-shadow:0 0 0 0 #f5c40099;animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 18px #f5c40000}}
.ov{position:fixed;inset:0;background:#05060acc;backdrop-filter:blur(10px);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--card);border:1px solid #3d3300;border-radius:8px 8px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:in .3s both}
.breath{width:190px;height:190px;border-radius:50%;margin:26px auto;display:grid;place-items:center;font-weight:700;color:#0a0a0a;background:radial-gradient(circle,#ffd83a,#6b5600);animation:br 14s infinite ease-in-out;box-shadow:0 0 70px #f5c40077}
@keyframes br{0%{transform:scale(.6)}28%,57%{transform:scale(1)}100%{transform:scale(.6)}}
.timer{font-size:40px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.c{text-align:center}
svg text{fill:var(--mut);font-size:10px}
@media(min-width:900px){nav{position:fixed;top:0;bottom:0;right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:22px 12px;justify-content:flex-start;gap:4px}
nav button{flex:none;flex-direction:row;font-size:14px;gap:12px;padding:11px 14px;justify-content:flex-start}
.logo{display:block}main{margin-left:230px;padding-bottom:40px}.sos{bottom:24px}.ov{align-items:center}.sheet{border-radius:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body><div id="app"><nav id="nav"></nav><main id="main"></main></div><div id="ov"></div><button class="sos" data-a="sos">SOS</button>
<script>
const $=s=>document.querySelector(s),K='offlust.v1';
const key=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF=()=>({name:'',goal:'Construir hábitos que me fazem bem',monthly:20,start:key(new Date()),cycles:[],days:{},habits:[{id:1,n:'Acordar à hora definida',i:'⏰'},{id:2,n:'Fazer exercício',i:'💪'},{id:3,n:'Estudar',i:'📚'},{id:4,n:'Ler',i:'📖'},{id:5,n:'Evitar conteúdos desencadeantes',i:'🛡️'},{id:6,n:'Dormir a horas regulares',i:'🌙'}],hd:{},sos:[],cfg:{on:false,m:'08:00',r:'21:00'}});
let S;try{S=Object.assign(DEF(),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=DEF()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let page='dash',cal=new Date(),sosS=null,tmr=null;
const TODAY=()=>key(new Date());
const ok=k=>S.days[k]&&S.days[k].ok===true;
const total=()=>Object.values(S.days).filter(d=>d.ok).length;
const hcount=()=>Object.values(S.hd).reduce((a,b)=>a+b.length,0);
function streak(){let d=new Date(),n=0;if(!ok(key(d)))d.setDate(d.getDate()-1);while(ok(key(d))&&key(d)>=S.start){n++;d.setDate(d.getDate()-1)}return n}
function best(){let b=streak();S.cycles.forEach(c=>b=Math.max(b,c.best||0));return b}
const CH=[[1,'Começar','🌱'],[3,'Identificar padrões','🔎'],[7,'Primeira semana','🔥'],[14,'Construir consistência','🧱'],[21,'Fortalecer hábitos','⚡'],[30,'Avaliar evolução','📈'],[60,'Consolidar mudanças','🏔️'],[90,'Rever objetivos','👑']];
const MED=[['Primeiro passo','🥉',()=>total()>=1],['Autoconsciência','🧠',()=>Object.values(S.days).filter(d=>d.tr).length>=3],['Pedi ajuda a mim próprio','🛟',()=>S.sos.length>=1],['Rotina em marcha','✅',()=>hcount()>=10],['Semana completa','🥈',()=>total()>=7],['Mês de consistência','🥇',()=>total()>=30],['Diário fiel','📓',()=>Object.keys(S.days).length>=14]];
function xp(){let x=total()*10+hcount()*5+S.sos.length*15+Object.values(S.days).filter(d=>d.urge!=null).length*5;CH.forEach(c=>{if(total()>=c[0])x+=20+c[0]});MED.forEach(m=>{if(m[2]())x+=25});return x}
const lvl=()=>Math.floor(xp()/150)+1;
function bars(v,l,max,h=110){const w=300,bw=w/v.length;return `<svg viewBox="0 0 ${w} ${h+18}" width="100%">`+v.map((x,i)=>{const bh=max?Math.max(2,x/max*h):2;return `<rect x="${i*bw+6}" y="${h-bh}" width="${bw-12}" height="${bh}" rx="6" fill="${x?'#f5c400':'#26262a'}"/><text x="${i*bw+bw/2}" y="${h+13}" text-anchor="middle">${l[i]}</text>`}).join('')+'</svg>'}
const DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const NAV=[['dash','◉','Dashboard'],['hab','☑','Hábitos'],['cal','▦','Calendário'],['ch','★','Desafios'],['st','▮','Estatísticas'],['pf','☺','Perfil']];
function nav(){$('#nav').innerHTML='<div class="logo">OFF<b>LUST</b></div>'+NAV.map(n=>`<button class="${page==n[0]?'on':''}" data-a="go" data-v="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join('')}
function weekDays(){const a=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(d)}return a}
function dayScore(k){return (ok(k)?50:0)+(S.hd[k]?Math.min(1,S.hd[k].length/S.habits.length)*50:0)}
const P={};
P.dash=()=>{const st=streak(),mo=Object.keys(S.days).filter(k=>ok(k)&&k.slice(0,7)==TODAY().slice(0,7)).length,wk=weekDays().filter(d=>ok(key(d))).length,td=TODAY(),hd=(S.hd[td]||[]).length,L=xp()%150;
return `<h1>Olá${S.name?', '+esc(S.name):''}</h1><p class="sub">${new Date().toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'})}</p>
<div class="card quote c"><div class="big">${st}</div><div class="mut" style="margin:6px 0 10px">${st==1?'dia':'dias'} consecutivos · melhor ciclo: ${best()}</div><p><b>Um dia de cada vez. O teu progresso começa agora.</b></p><br><button class="btn" data-a="day" data-v="${td}">${S.days[td]?'Editar registo de hoje':'Registar hoje'}</button></div>
<div class="grid"><div class="card"><h2>Progresso semanal</h2>${bars(weekDays().map(d=>dayScore(key(d))),weekDays().map(d=>DS[d.getDay()][0]),100)}<p class="mut">${wk}/7 dias cumpridos</p></div>
<div class="card"><h2>Objetivo mensal</h2><div class="big" style="font-size:36px">${mo}/${S.monthly}</div><div class="bar"><i style="width:${Math.min(100,mo/S.monthly*100)}%"></i></div><p class="mut">${esc(S.goal)}</p></div>
<div class="card"><h2>Nível ${lvl()}</h2><div class="bar"><i style="width:${L/150*100}%"></i></div><p class="mut">${xp()} XP · ${MED.filter(m=>m[2]()).length}/${MED.length} medalhas · ${hcount()} hábitos concluídos</p></div></div>
<div class="card" style="margin-top:14px"><h2>Missões de hoje</h2>${[['Registar o dia',!!S.days[td]],['Concluir 1 hábito',hd>=1],['Registar o nível de vontade',S.days[td]&&S.days[td].urge!=null]].map(m=>`<div class="item"><div class="chk ${m[1]?'on':''}">${m[1]?'✓':''}</div><div class="t">${m[0]}</div><span class="mut">+5 XP</span></div>`).join('')}<h2 style="margin-top:14px">Missões da semana</h2>${[['5 dias registados',weekDays().filter(d=>S.days[key(d)]).length>=5],['15 hábitos concluídos',weekDays().reduce((a,d)=>a+(S.hd[key(d)]||[]).length,0)>=15]].map(m=>`<div class="item"><div class="chk ${m[1]?'on':''}">${m[1]?'✓':''}</div><div class="t">${m[0]}</div></div>`).join('')}</div>
<p class="c mut" style="margin-top:20px">“Não precisas de ser perfeito. Precisas de continuar a construir hábitos que te fazem bem.”</p>`};
P.hab=()=>{const td=TODAY(),d=S.hd[td]||[];return `<h1>Hábitos</h1><p class="sub">Rotina diária · ${d.length}/${S.habits.length} hoje</p><div class="card">${S.habits.map(h=>`<div class="item"><button class="chk ${d.includes(h.id)?'on':''}" data-a="hab" data-v="${h.id}">${d.includes(h.id)?'✓':''}</button><div class="t">${h.i} ${esc(h.n)}</div><button class="mut" data-a="delh" data-v="${h.id}">✕</button></div>`).join('')}</div>
<div class="card"><h2>Adicionar tarefa</h2><input id="hn" placeholder="Ex.: Caminhar 20 minutos"><button class="btn" data-a="addh">Adicionar</button></div>`};
P.cal=()=>{const y=cal.getFullYear(),m=cal.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let c=DS.map(x=>`<div class="h">${x[0]}</div>`).join('')+'<span></span>'.repeat(f).replace(/<span><\/span>/g,'<div class="h"></div>');
for(let i=1;i<=n;i++){const k=key(new Date(y,m,i)),dd=S.days[k];c+=`<div class="${dd?(dd.ok?'ok':'hard'):''} ${k==TODAY()?'td':''}" data-a="day" data-v="${k}">${i}</div>`}
return `<h1>Calendário</h1><p class="sub">Toca num dia para o registar ou editar.</p><div class="card"><div class="row" style="margin-bottom:12px"><button class="btn g" data-a="cm" data-v="-1">‹</button><b>${cal.toLocaleDateString('pt-PT',{month:'long',year:'numeric'})}</b><button class="btn g" data-a="cm" data-v="1">›</button></div><div class="cal">${c}</div><p class="mut" style="margin-top:12px"><span class="pill on">Dia cumprido</span><span class="pill">Dia difícil (também conta como informação útil)</span></p></div>`};
P.ch=()=>{const t=total();return `<h1>Desafios</h1><p class="sub">${t} dias cumpridos no total — o que conta é a consistência, mesmo com interrupções.</p>${CH.map(c=>`<div class="card"><div class="row"><div><b>${c[2]} Dia ${c[0]} · ${c[1]}</b><div class="mut">Recompensa: +${20+c[0]} XP</div></div><span class="pill ${t>=c[0]?'on':''}">${t>=c[0]?'Concluído':Math.min(t,c[0])+'/'+c[0]}</span></div><div class="bar"><i style="width:${Math.min(100,t/c[0]*100)}%"></i></div></div>`).join('')}<h2 style="margin-top:20px">Medalhas</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">${MED.map(m=>`<div class="med ${m[2]()?'':'off'}"><span>${m[1]}</span><div class="mut">${m[0]}</div></div>`).join('')}</div>`};
P.st=()=>{const w=weekDays(),wk=[];for(let i=3;i>=0;i--){let c=0;for(let j=0;j<7;j++){const d=new Date();d.setDate(d.getDate()-i*7-j);if(ok(key(d)))c++}wk.push(c)}
const tr={};Object.values(S.days).forEach(d=>d.tr&&d.tr.forEach(x=>tr[x]=(tr[x]||0)+1));const tv=Object.entries(tr).sort((a,b)=>b[1]-a[1]);
const ur=Array(7).fill(0).map(()=>[]);Object.entries(S.days).forEach(([k,d])=>{if(d.urge!=null)ur[new Date(k+'T12:00').getDay()].push(d.urge)});const ua=ur.map(a=>a.length?a.reduce((x,y)=>x+y)/a.length:0);
const pd=[0,0,0,0],pn=['Madrug.','Manhã','Tarde','Noite'];S.sos.forEach(s=>{const h=new Date(s.t).getHours();pd[h<6?0:h<12?1:h<18?2:3]++});
return `<h1>Estatísticas</h1><p class="sub">Padrões, não julgamentos.</p><div class="grid"><div class="card"><h2>Consistência semanal</h2>${bars(w.map(d=>dayScore(key(d))),w.map(d=>DS[d.getDay()]),100)}</div>
<div class="card"><h2>Evolução mensal (dias/semana)</h2>${bars(wk,['−3 sem','−2 sem','−1 sem','Esta'],7)}</div>
<div class="card"><h2>Hábitos concluídos (7 dias)</h2>${bars(w.map(d=>(S.hd[key(d)]||[]).length),w.map(d=>DS[d.getDay()]),S.habits.length)}</div>
<div class="card"><h2>Vontade média por dia da semana</h2>${bars(ua,DS,10)}<p class="mut">Mostra os dias de maior dificuldade.</p></div>
<div class="card"><h2>Uso do SOS (${S.sos.length})</h2>${bars(pd,pn,Math.max(...pd))}</div>
<div class="card"><h2>Situações desencadeantes</h2>${tv.length?tv.map(t=>`<div class="item"><div class="t">${esc(t[0])}</div><b>${t[1]}</b></div>`).join(''):'<p class="mut">Ainda sem dados. Regista situações ao preencher o dia.</p>'}</div></div>`};
P.pf=()=>`<h1>Perfil e definições</h1><p class="sub">Tudo fica guardado apenas neste dispositivo. Sem conta, sem partilha.</p>
<div class="card"><h2>Pessoal</h2><label class="mut">Nome (opcional)</label><input id="pn" value="${esc(S.name)}"><label class="mut">O meu objetivo</label><textarea id="pg" rows="2">${esc(S.goal)}</textarea><label class="mut">Meta mensal (dias)</label><input id="pm" type="number" min="1" max="31" value="${S.monthly}"><button class="btn" data-a="savep">Guardar</button></div>
<div class="card"><h2>Ciclos</h2><p class="mut">Reiniciar começa um novo ciclo e mantém todo o histórico. Recomeçar faz parte do processo.</p><br><button class="btn g" data-a="reset">Começar novo ciclo</button>${S.cycles.map(c=>`<div class="item"><div class="t">${c.start} → ${c.end}</div><span class="mut">melhor: ${c.best} dias</span></div>`).join('')}</div>
<div class="card"><h2>Notificações</h2><p class="mut">Mensagens sempre gentis. Os avisos aparecem enquanto a app estiver aberta; para lembretes com a app fechada é preciso instalá-la como aplicação.</p><div class="item"><div class="t">Lembrete matinal</div><input type="time" id="nm" value="${S.cfg.m}" style="width:120px"></div><div class="item"><div class="t">Revisão diária</div><input type="time" id="nr" value="${S.cfg.r}" style="width:120px"></div><button class="btn" data-a="notif">${S.cfg.on?'Guardar horas':'Ativar notificações'}</button> <button class="btn g" data-a="ntest">Testar</button></div>
<div class="card"><h2>Dados</h2><button class="btn g" data-a="exp">Exportar (JSON)</button> <button class="btn r" data-a="wipe">Apagar todo o histórico</button></div>`;
function render(){nav();$('#main').innerHTML=P[page]();window.scrollTo(0,0)}
const MSG=['Os impulsos passam como ondas. Estás a surfá-la.','Cada minuto que esperas é um minuto de controlo ganho.','Escolher pausar já é uma vitória.','Não és os teus impulsos. És quem decide o que fazer a seguir.'];
function dayModal(k){const d=S.days[k]||{ok:true,urge:3,tr:[],note:''};const T=['Tédio','Stress','Solidão','Noite / cama','Telemóvel','Cansaço','Ansiedade'];
$('#ov').innerHTML=`<div class="ov" data-a="close"><div class="sheet" onclick="event.stopPropagation()"><h2>${new Date(k+'T12:00').toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'})}</h2><p class="mut">Sem culpa: qualquer registo ajuda a perceber padrões.</p><br><button class="pill ${d.ok?'on':''}" data-a="okv" data-v="1">Cumpri o objetivo</button><button class="pill ${!d.ok?'on':''}" data-a="okv" data-v="0">Foi um dia difícil</button><p class="mut" style="margin-top:12px">Nível de vontade de agir por impulso: <b id="uv">${d.urge??3}</b>/10</p><input type="range" id="ur" min="0" max="10" value="${d.urge??3}" oninput="uv.textContent=this.value"><p class="mut">Situações desencadeantes</p><div id="trs">${T.map(t=>`<button class="pill ${(d.tr||[]).includes(t)?'on':''}" data-a="tr" data-v="${t}">${t}</button>`).join('')}</div><textarea id="nt" rows="2" placeholder="Nota (opcional)">${esc(d.note||'')}</textarea><button class="btn" data-a="saveday" data-v="${k}">Guardar</button> <button class="btn g" data-a="close">Cancelar</button></div></div>`;window._d={ok:d.ok,tr:[...(d.tr||[])]}}
function sosRender(){const s=sosS,o=$('#ov');if(!s){o.innerHTML='';return}
let h;if(s.st==0)h=`<h2>Respira. Estás a tempo.</h2><p class="mut">Vontade agora: <b id="uv">${s.b}</b>/10</p><input type="range" min="0" max="10" value="${s.b}" oninput="sosS.b=+this.value;uv.textContent=this.value"><div class="card" style="margin-top:10px"><div class="item">1 · Respiração guiada (inspira 4s, segura 4s, expira 6s)</div><div class="item">2 · Temporizador de 5 minutos</div><div class="item">3 · Muda de ambiente: sai do quarto, vai para uma zona comum</div><div class="item">4 · Caminha ou faz 20 agachamentos / flexões</div></div><button class="btn" data-a="sosgo">Começar</button> <button class="btn g" data-a="sosx">Fechar</button>`;
else if(s.st==1){const m=Math.floor(s.t/60),sc=String(s.t%60).padStart(2,'0'),e=300-s.t,p=e%14,ph=p<4?'Inspira':p<8?'Segura':'Expira';h=`<div class="timer">${m}:${sc}</div><div class="breath">${ph}</div><p class="c"><b>${MSG[s.m]}</b></p><p class="c mut">Se puderes, levanta-te e muda de espaço. Bebe água. Caminha um pouco.</p><br><div class="c"><button class="btn g" data-a="sosend">Terminar</button></div>`}
else h=`<h2>Como te sentes agora?</h2><p class="mut">Vontade antes: ${s.b}/10. Fizeste algo por ti.</p><br>${[['😣','Pior'],['😐','Igual'],['🙂','Melhor'],['😌','Calmo'],['💪','Forte']].map((f,i)=>`<button class="pill" style="font-size:18px" data-a="sosf" data-v="${f[1]}">${f[0]} ${f[1]}</button>`).join('')}`;
o.innerHTML=`<div class="ov"><div class="sheet">${h}</div></div>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.classList.contains('ov')&&e.target!==t)return;const a=t.dataset.a,v=t.dataset.v;
switch(a){case'go':page=v;render();break;
case'close':$('#ov').innerHTML='';break;
case'day':dayModal(v);break;
case'okv':window._d.ok=v=='1';document.querySelectorAll('[data-a=okv]').forEach(b=>b.classList.toggle('on',(b.dataset.v=='1')==window._d.ok));break;
case'tr':{const i=window._d.tr.indexOf(v);i<0?window._d.tr.push(v):window._d.tr.splice(i,1);t.classList.toggle('on');break}
case'saveday':S.days[v]={ok:window._d.ok,urge:+$('#ur').value,tr:window._d.tr,note:$('#nt').value};save();$('#ov').innerHTML='';render();break;
case'hab':{const k=TODAY(),a=S.hd[k]||(S.hd[k]=[]),i=a.indexOf(+v);i<0?a.push(+v):a.splice(i,1);save();render();break}
case'addh':{const n=$('#hn').value.trim();if(n){S.habits.push({id:Date.now(),n,i:'✨'});save();render()}break}
case'delh':if(confirm('Remover esta tarefa?')){S.habits=S.habits.filter(h=>h.id!=v);save();render()}break;
case'cm':cal=new Date(cal.getFullYear(),cal.getMonth()+ +v,1);render();break;
case'savep':S.name=$('#pn').value;S.goal=$('#pg').value;S.monthly=Math.max(1,+$('#pm').value||20);save();render();break;
case'reset':if(confirm('Começar um novo ciclo? O histórico fica guardado.')){S.cycles.push({start:S.start,end:TODAY(),best:streak()});S.start=TODAY();save();render()}break;
case'wipe':if(confirm('Apagar TODO o histórico? Não dá para desfazer.')){S=DEF();save();render()}break;
case'exp':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='offlust.json';a.click();break}
case'notif':S.cfg.m=$('#nm').value;S.cfg.r=$('#nr').value;if('Notification' in window)Notification.requestPermission().then(p=>{S.cfg.on=p=='granted';save();render()});else{S.cfg.on=true;save();render()}break;
case'ntest':if('Notification' in window&&Notification.permission=='granted')new Notification('OFFLUST',{body:'Um dia de cada vez. Estás a fazer o teu melhor.'});else alert('Um dia de cada vez. Estás a fazer o teu melhor. (Ativa as notificações para as receber no sistema.)');break;
case'sos':sosS={st:0,b:5,t:300,m:Math.floor(Math.random()*MSG.length)};sosRender();break;
case'sosx':sosS=null;sosRender();break;
case'sosgo':sosS.st=1;sosRender();tmr=setInterval(()=>{sosS.t--;if(sosS.t<=0){clearInterval(tmr);sosS.st=2}sosRender()},1000);break;
case'sosend':clearInterval(tmr);sosS.st=2;sosRender();break;
case'sosf':S.sos.push({t:Date.now(),b:sosS.b,a:v});save();sosS=null;sosRender();render();break}});
(function tick(){setInterval(()=>{if(!S.cfg.on||!('Notification' in window)||Notification.permission!='granted')return;const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');if(n.getSeconds()>5)return;if(hm==S.cfg.m)new Notification('OFFLUST',{body:'Bom dia! Hoje é mais um passo, sem pressa.'});if(hm==S.cfg.r)new Notification('OFFLUST',{body:'Hora da revisão do dia. Seja como for, regista com gentileza.'})},5000)})();
render();
</script></body></html>
